<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP do renderer. 'unsafe-inline' em script existe porque o servidor de dev
      do Vite injeta um preambulo inline; o build de producao pode remover isso.
      O renderer nunca carrega conteudo remoto, roda com contextIsolation e sem
      acesso ao Node.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss: http: https:;"
    />
    <title>Junto — transmitir</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
